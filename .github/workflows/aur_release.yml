name: aur_release

on:
  workflow_run:
    workflows:
      - release
      - release.yml
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, like v1.2.3"
        required: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    container: archlinux:latest

    # pass ssh options to git directly (config file in $HOME/.ssh is NOT
    # reliably read by git's ssh in GH Actions containers); accept-new
    # auto-trusts the host key on first connect so no keyscan is needed
    env:
      GIT_SSH_COMMAND: "ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

    steps:
      - name: install tools
        shell: bash
        run: |
          pacman -Sy --noconfirm --needed base-devel curl git jq openssh util-linux

      # checkout needs git, so it must run after the tools install step
      - name: checkout
        uses: actions/checkout@v4

      - name: configure ssh
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -e

          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY is required"
            exit 1
          fi

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"

      - name: resolve version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="$DISPATCH_VERSION"

          if [ -z "$VERSION" ]; then
            VERSION=$(curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" \
              | jq -r '.tag_name')
          fi

          VERSION="${VERSION#refs/tags/}"

          if [ -z "$VERSION" ] || [[ "$VERSION" != v* ]]; then
            echo "Could not resolve release tag."
            echo "Use manual workflow_dispatch with version=vX.Y.Z."
            exit 1
          fi

          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: clone aur package
        shell: bash
        run: |
          git clone ssh://aur@aur.archlinux.org/blob-bin.git aur

      # copies the PKGBUILD from this repo, then lets update.sh handle
      # hashes, .SRCINFO regeneration, commit, and push
      - name: update pkgbuild
        working-directory: aur
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp ../aur_publish/PKGBUILD ./PKGBUILD

          # makepkg refuses to run as root, so run the whole publish as a
          # non-root user. The builder gets its own copy of the SSH key so the
          # final git push works (root's key is 600/root-owned and unreadable
          # by builder), with GIT_SSH_COMMAND overridden to point at it.
          useradd -m builder
          chown -R builder "$PWD"

          mkdir -p /home/builder/.ssh
          cp "$HOME/.ssh/aur" /home/builder/.ssh/aur
          chown -R builder:builder /home/builder/.ssh
          chmod 700 /home/builder/.ssh
          chmod 600 /home/builder/.ssh/aur

          su -s /bin/bash builder -c "HOME=/home/builder GIT_SSH_COMMAND='ssh -i /home/builder/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new' ../aur_publish/update.sh $TAG"
