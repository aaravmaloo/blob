name: aur_release

on:
  workflow_run:
    workflows:
      - release
      - release.yml
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, like v1.2.3"
        required: true

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: install tools
        shell: bash
        run: |
          pacman -Sy --noconfirm --needed base-devel curl git jq openssh

      # checkout needs git, so it must run after the tools install step
      - name: checkout
        uses: actions/checkout@v4

      - name: configure ssh
        shell: bash
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ secrets.AUR_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY is required"
            exit 1
          fi

          SSH_DIR="$HOME/.ssh"
          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$SSH_DIR/aur"
          chmod 600 "$SSH_DIR/aur"

          if [ -n "$AUR_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$AUR_SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          else
            ssh-keyscan -H aur.archlinux.org > "$SSH_DIR/known_hosts"
          fi
          chmod 644 "$SSH_DIR/known_hosts"

          # NOTE: using printf instead of heredoc to avoid YAML indentation conflicts
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile %s/aur\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  UserKnownHostsFile %s/known_hosts\n' "$SSH_DIR" "$SSH_DIR" > "$SSH_DIR/config"
          chmod 600 "$SSH_DIR/config"

      - name: resolve version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="$DISPATCH_VERSION"

          if [ -z "$VERSION" ]; then
            VERSION=$(curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" \
              | jq -r '.tag_name')
          fi

          VERSION="${VERSION#refs/tags/}"

          if [ -z "$VERSION" ] || [[ "$VERSION" != v* ]]; then
            echo "Could not resolve release tag."
            echo "Use manual workflow_dispatch with version=vX.Y.Z."
            exit 1
          fi

          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: clone aur package
        shell: bash
        run: |
          git clone ssh://aur@aur.archlinux.org/blob-bin.git aur

      # copies the PKGBUILD from this repo, then lets update.sh handle
      # hashes, .SRCINFO regeneration, commit, and push
      - name: update pkgbuild
        working-directory: aur
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp ../aur_publish/PKGBUILD ./PKGBUILD
          ../aur_publish/update.sh "$TAG"
